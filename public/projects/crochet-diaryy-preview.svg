<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <rect width="1200" height="750" fill="#131418"/>
  <defs>
    <pattern id="gridC" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22242c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#gridC)" />
  
  <rect x="40" y="40" width="1120" height="670" fill="none" stroke="#2b2e39" stroke-width="1"/>
  
  <line x1="40" y1="90" x2="1160" y2="90" stroke="#2b2e39" stroke-width="1"/>
  <circle cx="70" cy="65" r="4" fill="#3d4252"/>
  <circle cx="85" cy="65" r="4" fill="#3d4252"/>
  <circle cx="100" cy="65" r="4" fill="#3d4252"/>
  
  <text x="130" y="70" font-family="monospace" font-size="12" fill="#8e929e" letter-spacing="2">THE CROCHET DIARYY // FULL-STACK NEXT.JS 15 E-COMMERCE</text>
  <text x="1120" y="70" font-family="monospace" font-size="11" fill="#e84a27" text-anchor="end">[POSTGRESQL • PRISMA • NEXTAUTH • RAZORPAY]</text>

  <!-- Left: E-Commerce Storefront Interface -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="500" height="420" fill="#16171d" stroke="#2b2e39" stroke-width="1"/>
    <line x1="0" y1="40" x2="500" y2="40" stroke="#22242c" stroke-width="1"/>
    <text x="20" y="26" font-family="monospace" font-size="11" fill="#8e929e" letter-spacing="1">NEXT.JS 15 STOREFRONT &amp; ZUSTAND CART</text>
    <text x="480" y="26" font-family="monospace" font-size="11" fill="#f4f4f6" text-anchor="end">APP ROUTER</text>

    <!-- Product Card Grid -->
    <g transform="translate(30, 60)">
      <!-- Product 1 -->
      <rect x="0" y="0" width="205" height="190" fill="#0f1013" stroke="#22242c" stroke-width="1"/>
      <rect x="15" y="15" width="175" height="95" fill="#181920"/>
      <text x="102" y="68" font-family="monospace" font-size="28" fill="#e84a27" text-anchor="middle">🧶</text>
      <text x="15" y="130" font-family="sans-serif" font-weight="600" font-size="12" fill="#f4f4f6">Handmade Cardigan</text>
      <text x="15" y="150" font-family="monospace" font-size="10" fill="#8e929e">Pure Merino Wool</text>
      <text x="15" y="172" font-family="monospace" font-size="12" fill="#e84a27" font-weight="bold">₹2,499</text>

      <!-- Product 2 -->
      <rect x="235" y="0" width="205" height="190" fill="#0f1013" stroke="#22242c" stroke-width="1"/>
      <rect x="250" y="15" width="175" height="95" fill="#181920"/>
      <text x="337" y="68" font-family="monospace" font-size="28" fill="#e84a27" text-anchor="middle">✨</text>
      <text x="250" y="130" font-family="sans-serif" font-weight="600" font-size="12" fill="#f4f4f6">Artisan Crochet Tote</text>
      <text x="250" y="150" font-family="monospace" font-size="10" fill="#8e929e">Organic Cotton Fiber</text>
      <text x="250" y="172" font-family="monospace" font-size="12" fill="#e84a27" font-weight="bold">₹1,299</text>
    </g>

    <!-- Zustand Cart Banner -->
    <rect x="30" y="270" width="440" height="50" fill="rgba(232, 74, 39, 0.12)" stroke="#e84a27" stroke-width="1"/>
    <text x="45" y="300" font-family="monospace" font-size="12" fill="#f4f4f6">PERSISTENT CART: 2 ITEMS • RAZORPAY CHECKOUT READY</text>

    <text x="30" y="365" font-family="monospace" font-size="11" fill="#8e929e">STACK: Next.js 15 • React 19 • Tailwind CSS v4 • Zustand</text>
    <text x="30" y="390" font-family="monospace" font-size="11" fill="#5e6270">PERFORMANCE: Sub-second Server Component hydration</text>
  </g>

  <!-- Right: Prisma PostgreSQL & Auth.js Architecture -->
  <g transform="translate(620, 130)">
    <rect x="0" y="0" width="500" height="420" fill="#181920" stroke="#2b2e39" stroke-width="1"/>
    <line x1="0" y1="40" x2="500" y2="40" stroke="#22242c" stroke-width="1"/>
    <text x="20" y="26" font-family="monospace" font-size="11" fill="#8e929e" letter-spacing="1">PRISMA ORM &amp; AUTHENTICATION ARCHITECTURE</text>
    <text x="480" y="26" font-family="monospace" font-size="11" fill="#e84a27" text-anchor="end">POSTGRESQL</text>

    <!-- Prisma schema box -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="450" height="150" fill="#111216" stroke="#22242c" stroke-width="1"/>
      <text x="15" y="25" font-family="monospace" font-size="11" fill="#e84a27">model Order {</text>
      <text x="35" y="50" font-family="monospace" font-size="11" fill="#8e929e">id String @id @default(cuid())</text>
      <text x="35" y="75" font-family="monospace" font-size="11" fill="#8e929e">userId String -> User @relation</text>
      <text x="35" y="100" font-family="monospace" font-size="11" fill="#8e929e">razorpayPaymentId String @unique</text>
      <text x="35" y="125" font-family="monospace" font-size="11" fill="#8e929e">status OrderStatus @default(PENDING)</text>
      <text x="15" y="145" font-family="monospace" font-size="11" fill="#e84a27">}</text>
    </g>

    <!-- Features ledger -->
    <g transform="translate(25, 230)">
      <rect x="0" y="0" width="450" height="100" fill="#131418" stroke="#22242c" stroke-width="1"/>
      <text x="15" y="25" font-family="monospace" font-size="11" fill="#8e929e">AUTHENTICATION &amp; SERVICES</text>
      <text x="15" y="50" font-family="monospace" font-size="11" fill="#f4f4f6">• NextAuth v5 JWT credential sessions &amp; OAuth</text>
      <text x="15" y="70" font-family="monospace" font-size="11" fill="#f4f4f6">• Resend automated transactional invoice dispatch</text>
      <text x="15" y="90" font-family="monospace" font-size="11" fill="#f4f4f6">• Cloudinary secure image optimization pipeline</text>
    </g>

    <text x="25" y="380" font-family="monospace" font-size="11" fill="#8e929e">DATABASE: PostgreSQL hosted with automated migrations</text>
  </g>

  <line x1="40" y1="670" x2="1160" y2="670" stroke="#2b2e39" stroke-width="1"/>
  <text x="70" y="692" font-family="monospace" font-size="11" fill="#5e6270">GITHUB // SOMYAMOONAT/CROCHET-WEBSITE</text>
  <text x="1130" y="692" font-family="monospace" font-size="11" fill="#8e929e" text-anchor="end">CASE 03 / FULL-STACK COMMERCE</text>
</svg>