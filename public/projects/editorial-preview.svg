<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <rect width="1200" height="750" fill="#131418"/>
  <defs>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22242c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#grid4)" />
  
  <!-- Outer frame -->
  <rect x="40" y="40" width="1120" height="670" fill="none" stroke="#2b2e39" stroke-width="1"/>
  
  <!-- Header bar -->
  <line x1="40" y1="90" x2="1160" y2="90" stroke="#2b2e39" stroke-width="1"/>
  <text x="70" y="70" font-family="monospace" font-size="12" fill="#8e929e" letter-spacing="2">EDITORIAL ENGINE // STATIC PUBLICATION</text>
  <text x="1120" y="70" font-family="monospace" font-size="11" fill="#e84a27" text-anchor="end">[LIGHTHOUSE: 100/100/100]</text>

  <!-- Editorial article wireframe -->
  <g transform="translate(180, 140)">
    <text x="0" y="30" font-family="monospace" font-size="12" fill="#e84a27" letter-spacing="2">ISSUE 04 // MONOGRAPH</text>
    <text x="0" y="80" font-family="serif" font-size="38" fill="#f4f4f6">The Architecture of Resilient Static Delivery</text>
    <text x="0" y="115" font-family="monospace" font-size="12" fill="#8e929e">SOMYA MOONAT • 8 MIN READ • MDX</text>

    <!-- Content columns wireframe -->
    <rect x="0" y="145" width="840" height="1" fill="#2b2e39"/>
    
    <rect x="0" y="170" width="520" height="12" fill="#3d4252" opacity="0.6"/>
    <rect x="0" y="195" width="500" height="12" fill="#3d4252" opacity="0.6"/>
    <rect x="0" y="220" width="480" height="12" fill="#3d4252" opacity="0.6"/>
    <rect x="0" y="245" width="530" height="12" fill="#3d4252" opacity="0.6"/>

    <!-- Aside column -->
    <rect x="580" y="170" width="260" height="140" fill="#181920" stroke="#2b2e39" stroke-width="1"/>
    <text x="600" y="200" font-family="monospace" font-size="11" fill="#e84a27">MARGINAL NOTE [01]</text>
    <text x="600" y="230" font-family="sans-serif" font-size="12" fill="#8e929e">Zero client-side layout shift</text>
    <text x="600" y="255" font-family="sans-serif" font-size="12" fill="#8e929e">achieved via pre-rendered</text>
    <text x="600" y="280" font-family="sans-serif" font-size="12" fill="#8e929e">typographic metrics.</text>
  </g>

  <!-- Dev watermark stamp -->
  <rect x="360" y="580" width="480" height="45" fill="#0d0e11" stroke="#e84a27" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="600" y="608" font-family="monospace" font-size="12" fill="#e84a27" letter-spacing="1.5" text-anchor="middle">
    [PLACEHOLDER SCREENSHOT — EDITORIAL PUBLISHING ENGINE]
  </text>
</svg>
