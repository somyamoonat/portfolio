<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <rect width="1200" height="750" fill="#131418"/>
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22242c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#grid1)" />
  
  <!-- Outer hairline frame -->
  <rect x="40" y="40" width="1120" height="670" fill="none" stroke="#2b2e39" stroke-width="1"/>
  
  <!-- Header bar -->
  <line x1="40" y1="90" x2="1160" y2="90" stroke="#2b2e39" stroke-width="1"/>
  <circle cx="70" cy="65" r="4" fill="#3d4252"/>
  <circle cx="85" cy="65" r="4" fill="#3d4252"/>
  <circle cx="100" cy="65" r="4" fill="#3d4252"/>
  
  <text x="130" y="70" font-family="monospace" font-size="12" fill="#8e929e" letter-spacing="2">DATASET AUDITING // SPATIAL ANNOTATION PIPELINE</text>
  <text x="1120" y="70" font-family="monospace" font-size="11" fill="#e84a27" text-anchor="end">[CURATION: 1,000+ SAMPLES • BASELINE ACCURACY +12%]</text>

  <!-- Left: Spatial Image Annotation & Bounding Inspector -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="500" height="420" fill="#16171d" stroke="#2b2e39" stroke-width="1"/>
    
    <!-- Top subhead -->
    <line x1="0" y1="40" x2="500" y2="40" stroke="#22242c" stroke-width="1"/>
    <text x="20" y="26" font-family="monospace" font-size="11" fill="#8e929e" letter-spacing="1">SPATIAL BOUNDING COORDINATE VERIFICATION</text>
    <text x="480" y="26" font-family="monospace" font-size="11" fill="#e84a27" text-anchor="end">IOU: 0.88</text>

    <!-- Visual viewport -->
    <rect x="30" y="65" width="440" height="260" fill="#0f1013" stroke="#22242c" stroke-width="1"/>
    
    <!-- Verified bounding box 1 -->
    <rect x="70" y="100" width="160" height="130" fill="rgba(232, 74, 39, 0.08)" stroke="#e84a27" stroke-width="1.5"/>
    <text x="75" y="92" font-family="monospace" font-size="10" fill="#e84a27">OBJ_01: target_component [conf: 0.982]</text>
    <circle cx="70" cy="100" r="3" fill="#e84a27"/>
    <circle cx="230" cy="100" r="3" fill="#e84a27"/>
    <circle cx="70" cy="230" r="3" fill="#e84a27"/>
    <circle cx="230" cy="230" r="3" fill="#e84a27"/>

    <!-- Noise-filtered secondary box (dashed) -->
    <rect x="260" y="140" width="180" height="140" fill="none" stroke="#5e6270" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="265" y="132" font-family="monospace" font-size="10" fill="#8e929e">FILTERED_LABEL: [variance resolved]</text>

    <!-- Dimension Crosshairs -->
    <line x1="30" y1="165" x2="470" y2="165" stroke="#22242c" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="150" y1="65" x2="150" y2="325" stroke="#22242c" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Bottom metadata -->
    <text x="30" y="360" font-family="monospace" font-size="11" fill="#8e929e">FRAME: 1920x1080 (Spatial Annotation Normalized)</text>
    <text x="30" y="385" font-family="monospace" font-size="11" fill="#5e6270">FORMAT: YOLO Bounding + Semantic Segmentation Bitmasks</text>
  </g>

  <!-- Right: Dataset Quality Ledger & Telemetry -->
  <g transform="translate(620, 130)">
    <rect x="0" y="0" width="500" height="420" fill="#181920" stroke="#2b2e39" stroke-width="1"/>
    
    <line x1="0" y1="40" x2="500" y2="40" stroke="#22242c" stroke-width="1"/>
    <text x="20" y="26" font-family="monospace" font-size="11" fill="#8e929e" letter-spacing="1">DATASET AUDITING &amp; ANNOTATION LEDGER</text>
    <text x="480" y="26" font-family="monospace" font-size="11" fill="#f4f4f6" text-anchor="end">STATUS: AUDITED</text>

    <!-- Metrics row 1 -->
    <g transform="translate(25, 65)">
      <rect x="0" y="0" width="215" height="70" fill="#131418" stroke="#22242c" stroke-width="1"/>
      <text x="15" y="24" font-family="monospace" font-size="10" fill="#8e929e">TOTAL CURATED IMAGES</text>
      <text x="15" y="55" font-family="monospace" font-size="24" fill="#f4f4f6">1,048</text>

      <rect x="235" y="0" width="215" height="70" fill="#131418" stroke="#22242c" stroke-width="1"/>
      <text x="250" y="24" font-family="monospace" font-size="10" fill="#8e929e">ACCURACY DELTA</text>
      <text x="250" y="55" font-family="monospace" font-size="24" fill="#e84a27">+12.4%</text>
    </g>

    <!-- Data cleaning breakdown table -->
    <g transform="translate(25, 160)">
      <text x="0" y="0" font-family="monospace" font-size="11" fill="#8e929e">NOISE REDUCTION BREAKDOWN</text>
      
      <!-- Row 1 -->
      <line x1="0" y1="18" x2="450" y2="18" stroke="#22242c" stroke-width="1"/>
      <text x="0" y="38" font-family="monospace" font-size="12" fill="#f4f4f6">False Positive Boundary Noise</text>
      <rect x="260" y="27" width="130" height="12" fill="#e84a27"/>
      <text x="450" y="38" font-family="monospace" font-size="12" fill="#f4f4f6" text-anchor="end">-24.2%</text>

      <!-- Row 2 -->
      <line x1="0" y1="54" x2="450" y2="54" stroke="#22242c" stroke-width="1"/>
      <text x="0" y="74" font-family="monospace" font-size="12" fill="#f4f4f6">Label Ambiguity Resolution</text>
      <rect x="260" y="63" width="150" height="12" fill="#e84a27" opacity="0.85"/>
      <text x="450" y="74" font-family="monospace" font-size="12" fill="#f4f4f6" text-anchor="end">100%</text>

      <!-- Row 3 -->
      <line x1="0" y1="90" x2="450" y2="90" stroke="#22242c" stroke-width="1"/>
      <text x="0" y="110" font-family="monospace" font-size="12" fill="#f4f4f6">IoU Alignment Threshold</text>
      <rect x="260" y="99" width="140" height="12" fill="#e84a27" opacity="0.9"/>
      <text x="450" y="110" font-family="monospace" font-size="12" fill="#f4f4f6" text-anchor="end">&gt; 0.85</text>

      <!-- Row 4 -->
      <line x1="0" y1="126" x2="450" y2="126" stroke="#22242c" stroke-width="1"/>
      <text x="0" y="146" font-family="monospace" font-size="12" fill="#f4f4f6">Export Format Standardization</text>
      <text x="450" y="146" font-family="monospace" font-size="12" fill="#8e929e" text-anchor="end">YOLO / VOC / COCO</text>
    </g>

    <!-- Bottom summary line -->
    <line x1="25" y1="355" x2="475" y2="355" stroke="#22242c" stroke-width="1"/>
    <text x="25" y="385" font-family="monospace" font-size="11" fill="#8e929e">PIPELINE: Python 3.11 • OpenCV • LabelImg • Systematic Audit Scripts</text>
  </g>

  <!-- Footer bar -->
  <line x1="40" y1="670" x2="1160" y2="670" stroke="#2b2e39" stroke-width="1"/>
  <text x="70" y="692" font-family="monospace" font-size="11" fill="#5e6270">ENGINEERING ARCHIVE // SOMYA MOONAT</text>
  <text x="1130" y="692" font-family="monospace" font-size="11" fill="#8e929e" text-anchor="end">CASE 01 / COMPUTER VISION</text>
</svg>