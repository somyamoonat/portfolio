<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <rect width="1200" height="750" fill="#131418"/>
  <defs>
    <pattern id="gridS" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22242c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#gridS)" />
  
  <rect x="40" y="40" width="1120" height="670" fill="none" stroke="#2b2e39" stroke-width="1"/>
  
  <line x1="40" y1="90" x2="1160" y2="90" stroke="#2b2e39" stroke-width="1"/>
  <circle cx="70" cy="65" r="4" fill="#3d4252"/>
  <circle cx="85" cy="65" r="4" fill="#3d4252"/>
  <circle cx="100" cy="65" r="4" fill="#3d4252"/>
  
  <text x="130" y="70" font-family="monospace" font-size="12" fill="#8e929e" letter-spacing="2">SIGN-TO-VOICE // REAL-TIME ASL GESTURE TO SPEECH ENGINE</text>
  <text x="1120" y="70" font-family="monospace" font-size="11" fill="#e84a27" text-anchor="end">[INFERENCE: ~12MS • WASM / WEBGL • 60 FPS]</text>

  <!-- Left: Webcam Hand Landmark Tracking View -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="500" height="420" fill="#16171d" stroke="#2b2e39" stroke-width="1"/>
    <line x1="0" y1="40" x2="500" y2="40" stroke="#22242c" stroke-width="1"/>
    <text x="20" y="26" font-family="monospace" font-size="11" fill="#8e929e" letter-spacing="1">WEBCAM LANDMARK TRACKING</text>
    <text x="480" y="26" font-family="monospace" font-size="11" fill="#e84a27" text-anchor="end">FPS: 60</text>

    <!-- Simulated Hand Skeleton -->
    <rect x="30" y="60" width="440" height="260" fill="#0f1013" stroke="#22242c" stroke-width="1"/>
    
    <!-- Skeleton joints and bones -->
    <g transform="translate(180, 80)">
      <!-- Wrist -->
      <circle cx="70" cy="180" r="4" fill="#e84a27"/>
      <!-- Palm -->
      <line x1="70" y1="180" x2="30" y2="130" stroke="#e84a27" stroke-width="2"/>
      <line x1="70" y1="180" x2="55" y2="105" stroke="#e84a27" stroke-width="2"/>
      <line x1="70" y1="180" x2="85" y2="100" stroke="#e84a27" stroke-width="2"/>
      <line x1="70" y1="180" x2="115" y2="110" stroke="#e84a27" stroke-width="2"/>
      <line x1="70" y1="180" x2="140" y2="135" stroke="#e84a27" stroke-width="2"/>

      <!-- Fingers joints -->
      <circle cx="30" cy="130" r="3" fill="#f4f4f6"/>
      <circle cx="20" cy="95" r="3" fill="#f4f4f6"/>
      <line x1="30" y1="130" x2="20" y2="95" stroke="#f4f4f6" stroke-width="1.5"/>

      <circle cx="55" cy="105" r="3" fill="#f4f4f6"/>
      <circle cx="50" cy="65" r="3" fill="#e84a27"/>
      <line x1="55" y1="105" x2="50" y2="65" stroke="#f4f4f6" stroke-width="1.5"/>

      <circle cx="85" cy="100" r="3" fill="#f4f4f6"/>
      <circle cx="85" cy="55" r="3" fill="#e84a27"/>
      <line x1="85" y1="100" x2="85" y2="55" stroke="#f4f4f6" stroke-width="1.5"/>

      <circle cx="115" cy="110" r="3" fill="#f4f4f6"/>
      <circle cx="120" cy="70" r="3" fill="#f4f4f6"/>
      <line x1="115" y1="110" x2="120" y2="70" stroke="#f4f4f6" stroke-width="1.5"/>

      <circle cx="140" cy="135" r="3" fill="#f4f4f6"/>
      <circle cx="155" cy="105" r="3" fill="#f4f4f6"/>
      <line x1="140" y1="135" x2="155" y2="105" stroke="#f4f4f6" stroke-width="1.5"/>
    </g>

    <!-- Detected gesture badge -->
    <rect x="40" y="270" width="420" height="40" fill="rgba(232, 74, 39, 0.15)" stroke="#e84a27" stroke-width="1"/>
    <text x="55" y="295" font-family="monospace" font-size="12" fill="#f4f4f6">DETECTED: "HELLO / WELCOME" [CONF: 0.984]</text>

    <text x="30" y="355" font-family="monospace" font-size="11" fill="#8e929e">LATENCY: ~12ms Browser-native Wasm execution</text>
    <text x="30" y="380" font-family="monospace" font-size="11" fill="#5e6270">ZERO SERVER DEPENDENCY: Works completely on-device without cloud GPU</text>
  </g>

  <!-- Right: Speech Synthesis & Telemetry -->
  <g transform="translate(620, 130)">
    <rect x="0" y="0" width="500" height="420" fill="#181920" stroke="#2b2e39" stroke-width="1"/>
    <line x1="0" y1="40" x2="500" y2="40" stroke="#22242c" stroke-width="1"/>
    <text x="20" y="26" font-family="monospace" font-size="11" fill="#8e929e" letter-spacing="1">VOICE SYNTHESIS &amp; AUDIO PIPELINE</text>
    <text x="480" y="26" font-family="monospace" font-size="11" fill="#f4f4f6" text-anchor="end">AUDIO API</text>

    <!-- Audio waveform -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="450" height="110" fill="#111216" stroke="#22242c" stroke-width="1"/>
      <text x="15" y="25" font-family="monospace" font-size="11" fill="#8e929e">SPEECH SYNTHESIS STREAM</text>
      
      <!-- Waveform bars -->
      <g transform="translate(15, 45)">
        <rect x="0" y="20" width="6" height="20" fill="#e84a27"/>
        <rect x="12" y="10" width="6" height="40" fill="#e84a27"/>
        <rect x="24" y="5" width="6" height="50" fill="#e84a27"/>
        <rect x="36" y="15" width="6" height="30" fill="#e84a27"/>
        <rect x="48" y="25" width="6" height="10" fill="#e84a27"/>
        <rect x="60" y="18" width="6" height="24" fill="#e84a27"/>
        <rect x="72" y="8" width="6" height="44" fill="#e84a27"/>
        <rect x="84" y="2" width="6" height="56" fill="#e84a27"/>
        <rect x="96" y="14" width="6" height="32" fill="#e84a27"/>
        <rect x="108" y="22" width="6" height="16" fill="#e84a27"/>
        <rect x="120" y="12" width="6" height="36" fill="#e84a27"/>
        <rect x="132" y="4" width="6" height="52" fill="#e84a27"/>
        <rect x="144" y="16" width="6" height="28" fill="#e84a27"/>
      </g>
      <text x="180" y="70" font-family="sans-serif" font-size="15" fill="#f4f4f6">"Hello, pleased to meet you."</text>
    </g>

    <!-- Accessibility Metrics -->
    <g transform="translate(25, 195)">
      <rect x="0" y="0" width="450" height="135" fill="#131418" stroke="#22242c" stroke-width="1"/>
      <text x="15" y="25" font-family="monospace" font-size="11" fill="#8e929e">SYSTEM METRICS</text>
      
      <text x="15" y="55" font-family="monospace" font-size="12" fill="#f4f4f6">Inference Latency:</text>
      <text x="430" y="55" font-family="monospace" font-size="12" fill="#e84a27" text-anchor="end">12.4 ms</text>

      <text x="15" y="80" font-family="monospace" font-size="12" fill="#f4f4f6">Webcam Frame Rate:</text>
      <text x="430" y="80" font-family="monospace" font-size="12" fill="#f4f4f6" text-anchor="end">60 FPS</text>

      <text x="15" y="105" font-family="monospace" font-size="12" fill="#f4f4f6">Privacy Compliance:</text>
      <text x="430" y="105" font-family="monospace" font-size="12" fill="#e84a27" text-anchor="end">100% On-Device</text>
    </g>

    <text x="25" y="380" font-family="monospace" font-size="11" fill="#8e929e">TECH: JavaScript • WebAssembly • WebGL • Web Speech API</text>
  </g>

  <line x1="40" y1="670" x2="1160" y2="670" stroke="#2b2e39" stroke-width="1"/>
  <text x="70" y="692" font-family="monospace" font-size="11" fill="#5e6270">GITHUB // SOMYAMOONAT/SIGN-TO-VOICE-</text>
  <text x="1130" y="692" font-family="monospace" font-size="11" fill="#8e929e" text-anchor="end">CASE 02 / ACCESSIBILITY CV</text>
</svg>