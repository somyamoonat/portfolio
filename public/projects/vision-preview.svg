<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <rect width="1200" height="750" fill="#131418"/>
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22242c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#grid3)" />
  
  <!-- Outer frame -->
  <rect x="40" y="40" width="1120" height="670" fill="none" stroke="#2b2e39" stroke-width="1"/>
  
  <!-- Header bar -->
  <line x1="40" y1="90" x2="1160" y2="90" stroke="#2b2e39" stroke-width="1"/>
  <text x="70" y="70" font-family="monospace" font-size="12" fill="#8e929e" letter-spacing="2">VISION INFERENCE // ANOMALY DETECTION IN BRAIN</text>
  <text x="1120" y="70" font-family="monospace" font-size="11" fill="#e84a27" text-anchor="end">[MODEL: CONV-QUANTIZED ONNX]</text>

  <!-- Visual inspection grid -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="500" height="380" fill="#16171d" stroke="#2b2e39" stroke-width="1"/>
    <!-- Wireframe bounding boxes -->
    <rect x="80" y="60" width="140" height="140" fill="none" stroke="#e84a27" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="85" y="50" font-family="monospace" font-size="11" fill="#e84a27">DEFECT_01: conf=0.974</text>

    <rect x="280" y="160" width="160" height="150" fill="none" stroke="#3d4252" stroke-width="1"/>
    <text x="285" y="150" font-family="monospace" font-size="11" fill="#8e929e">REGION_NORMAL</text>

    <text x="30" y="350" font-family="monospace" font-size="12" fill="#8e929e">INPUT_FRAME: 1920x1080 (Cropped 512x512) • FPS: 60</text>
  </g>

  <!-- Confusion matrix / metrics panel -->
  <g transform="translate(620, 130)">
    <rect x="0" y="0" width="500" height="380" fill="#181920" stroke="#2b2e39" stroke-width="1"/>
    <text x="30" y="40" font-family="monospace" font-size="12" fill="#8e929e">CLASS EVALUATION BREAKDOWN</text>
    
    <g transform="translate(30, 70)">
      <text x="0" y="30" font-family="monospace" font-size="13" fill="#f4f4f6">SURFACE_CRACK</text>
      <rect x="180" y="15" width="220" height="18" fill="#e84a27"/>
      <text x="420" y="30" font-family="monospace" font-size="13" fill="#f4f4f6">97.8%</text>

      <text x="0" y="80" font-family="monospace" font-size="13" fill="#f4f4f6">DEFORMATION</text>
      <rect x="180" y="65" width="200" height="18" fill="#e84a27" opacity="0.85"/>
      <text x="420" y="80" font-family="monospace" font-size="13" fill="#f4f4f6">94.2%</text>

      <text x="0" y="130" font-family="monospace" font-size="13" fill="#f4f4f6">VOID_POCKET</text>
      <rect x="180" y="115" width="210" height="18" fill="#e84a27" opacity="0.9"/>
      <text x="420" y="130" font-family="monospace" font-size="13" fill="#f4f4f6">96.1%</text>

      <text x="0" y="180" font-family="monospace" font-size="13" fill="#f4f4f6">SURFACE_DISCOLOR</text>
      <rect x="180" y="165" width="190" height="18" fill="#e84a27" opacity="0.75"/>
      <text x="420" y="180" font-family="monospace" font-size="13" fill="#f4f4f6">92.0%</text>
    </g>

    <text x="30" y="350" font-family="monospace" font-size="11" fill="#5e6270">QUANTIZATION: FP32 -> INT8 (68% SIZE REDUCTION)</text>
  </g>

  <!-- Dev watermark stamp -->
  <rect x="360" y="580" width="480" height="45" fill="#0d0e11" stroke="#e84a27" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="600" y="608" font-family="monospace" font-size="12" fill="#e84a27" letter-spacing="1.5" text-anchor="middle">
    [PLACEHOLDER SCREENSHOT — VISION ANOMALY DETECTOR]
  </text>
</svg>
