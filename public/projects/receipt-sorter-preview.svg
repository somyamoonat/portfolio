<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <rect width="1200" height="750" fill="#131418"/>
  <defs>
    <pattern id="gridR" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22242c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#gridR)" />
  
  <rect x="40" y="40" width="1120" height="670" fill="none" stroke="#2b2e39" stroke-width="1"/>
  
  <line x1="40" y1="90" x2="1160" y2="90" stroke="#2b2e39" stroke-width="1"/>
  <circle cx="70" cy="65" r="4" fill="#3d4252"/>
  <circle cx="85" cy="65" r="4" fill="#3d4252"/>
  <circle cx="100" cy="65" r="4" fill="#3d4252"/>
  
  <text x="130" y="70" font-family="monospace" font-size="12" fill="#8e929e" letter-spacing="2">RECEIPTSORTER // OFFLINE-FIRST VISION EXTRACTION</text>
  <text x="1120" y="70" font-family="monospace" font-size="11" fill="#e84a27" text-anchor="end">[LOCAL INFERENCE • ZERO CLOUD APIS • SQLITE]</text>

  <!-- Left: Vision Receipt Scanner View -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="500" height="420" fill="#16171d" stroke="#2b2e39" stroke-width="1"/>
    <line x1="0" y1="40" x2="500" y2="40" stroke="#22242c" stroke-width="1"/>
    <text x="20" y="26" font-family="monospace" font-size="11" fill="#8e929e" letter-spacing="1">LOCAL VISION EXTRACTION VIEWPORT</text>
    <text x="480" y="26" font-family="monospace" font-size="11" fill="#e84a27" text-anchor="end">100% OFFLINE</text>

    <!-- Simulated Receipt Card -->
    <rect x="50" y="60" width="400" height="260" fill="#0f1013" stroke="#22242c" stroke-width="1"/>
    
    <text x="70" y="90" font-family="monospace" font-size="12" fill="#8e929e">VENDOR:</text>
    <text x="140" y="90" font-family="monospace" font-size="13" fill="#f4f4f6" font-weight="bold">Acme Cloud Servers Ltd</text>
    <rect x="135" y="76" width="220" height="18" fill="none" stroke="#e84a27" stroke-width="1" stroke-dasharray="2,2"/>

    <text x="70" y="125" font-family="monospace" font-size="12" fill="#8e929e">DATE:</text>
    <text x="140" y="125" font-family="monospace" font-size="12" fill="#f4f4f6">2026-10-18</text>

    <text x="70" y="160" font-family="monospace" font-size="12" fill="#8e929e">LINE ITEMS:</text>
    <text x="70" y="185" font-family="monospace" font-size="11" fill="#8e929e">01. Bare-metal Instance Node-A</text>
    <text x="410" y="185" font-family="monospace" font-size="11" fill="#f4f4f6" text-anchor="end">$84.00</text>
    <text x="70" y="210" font-family="monospace" font-size="11" fill="#8e929e">02. NVMe Storage Volume 2TB</text>
    <text x="410" y="210" font-family="monospace" font-size="11" fill="#f4f4f6" text-anchor="end">$36.00</text>

    <line x1="70" y1="230" x2="410" y2="230" stroke="#22242c" stroke-width="1"/>
    <text x="70" y="255" font-family="monospace" font-size="13" fill="#e84a27" font-weight="bold">TOTAL DETECTED:</text>
    <text x="410" y="255" font-family="monospace" font-size="15" fill="#e84a27" text-anchor="end" font-weight="bold">$120.00 USD</text>

    <text x="30" y="360" font-family="monospace" font-size="11" fill="#8e929e">ENGINE: Open-weight local vision models (Llama-Vision / Ollama)</text>
    <text x="30" y="385" font-family="monospace" font-size="11" fill="#5e6270">PRIVACY: No telemetry • Zero egress bandwidth • Pure client sandbox</text>
  </g>

  <!-- Right: Persistent SQLite Ledger -->
  <g transform="translate(620, 130)">
    <rect x="0" y="0" width="500" height="420" fill="#181920" stroke="#2b2e39" stroke-width="1"/>
    <line x1="0" y1="40" x2="500" y2="40" stroke="#22242c" stroke-width="1"/>
    <text x="20" y="26" font-family="monospace" font-size="11" fill="#8e929e" letter-spacing="1">PERSISTENT SQLITE DATABASE SCHEMA</text>
    <text x="480" y="26" font-family="monospace" font-size="11" fill="#f4f4f6" text-anchor="end">LEDGER: READY</text>

    <!-- Schema code snippet -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="450" height="260" fill="#111216" stroke="#22242c" stroke-width="1"/>
      <text x="20" y="30" font-family="monospace" font-size="11" fill="#e84a27">CREATE TABLE</text>
      <text x="120" y="30" font-family="monospace" font-size="11" fill="#f4f4f6">receipts (</text>
      <text x="40" y="55" font-family="monospace" font-size="11" fill="#8e929e">id TEXT PRIMARY KEY,</text>
      <text x="40" y="80" font-family="monospace" font-size="11" fill="#8e929e">vendor TEXT NOT NULL,</text>
      <text x="40" y="105" font-family="monospace" font-size="11" fill="#8e929e">date DATE NOT NULL,</text>
      <text x="40" y="130" font-family="monospace" font-size="11" fill="#8e929e">total_amount REAL NOT NULL,</text>
      <text x="40" y="155" font-family="monospace" font-size="11" fill="#8e929e">tax_amount REAL,</text>
      <text x="40" y="180" font-family="monospace" font-size="11" fill="#8e929e">currency TEXT DEFAULT 'USD',</text>
      <text x="40" y="205" font-family="monospace" font-size="11" fill="#8e929e">category TEXT,</text>
      <text x="40" y="230" font-family="monospace" font-size="11" fill="#e84a27">raw_json JSONB</text>
      <text x="20" y="250" font-family="monospace" font-size="11" fill="#f4f4f6">);</text>
    </g>

    <text x="25" y="355" font-family="monospace" font-size="11" fill="#8e929e">EXPORTS: Multi-format CSV / JSON / PDF Summaries</text>
    <text x="25" y="385" font-family="monospace" font-size="11" fill="#5e6270">AUDITING: Instant tax reconciliation for freelancers &amp; contractors</text>
  </g>

  <line x1="40" y1="670" x2="1160" y2="670" stroke="#2b2e39" stroke-width="1"/>
  <text x="70" y="692" font-family="monospace" font-size="11" fill="#5e6270">GITHUB // SOMYAMOONAT/RECIPT-SORTER</text>
  <text x="1130" y="692" font-family="monospace" font-size="11" fill="#8e929e" text-anchor="end">CASE 01 / LOCAL COMPUTER VISION</text>
</svg>