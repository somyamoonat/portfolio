<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <rect width="1200" height="750" fill="#131418"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22242c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#grid)" />
  
  <!-- Outer hairline frame -->
  <rect x="40" y="40" width="1120" height="670" fill="none" stroke="#2b2e39" stroke-width="1"/>
  
  <!-- Header bar -->
  <line x1="40" y1="90" x2="1160" y2="90" stroke="#2b2e39" stroke-width="1"/>
  <circle cx="70" cy="65" r="4" fill="#3d4252"/>
  <circle cx="85" cy="65" r="4" fill="#3d4252"/>
  <circle cx="100" cy="65" r="4" fill="#3d4252"/>
  
  <text x="130" y="70" font-family="monospace" font-size="12" fill="#8e929e" letter-spacing="2">DEMO.SOMYAMOONAT.TECH / SEARCH-INDEX</text>
  <text x="1120" y="70" font-family="monospace" font-size="11" fill="#e84a27" text-anchor="end">[ML ENGINE: HYBRID EMBEDDINGS]</text>

  <!-- Query simulator box -->
  <rect x="80" y="130" width="1040" height="60" fill="#181920" stroke="#2b2e39" stroke-width="1"/>
  <text x="110" y="166" font-family="monospace" font-size="15" fill="#f4f4f6">query: "distributed index retrieval latency &lt; 40ms" █</text>
  
  <!-- Results table wireframe -->
  <g transform="translate(80, 230)">
    <rect x="0" y="0" width="1040" height="40" fill="#1b1c24" stroke="#2b2e39" stroke-width="1"/>
    <text x="20" y="25" font-family="monospace" font-size="12" fill="#8e929e">RANK</text>
    <text x="100" y="25" font-family="monospace" font-size="12" fill="#8e929e">SCORE (HYBRID)</text>
    <text x="280" y="25" font-family="monospace" font-size="12" fill="#8e929e">DOCUMENT CHUNK</text>
    <text x="900" y="25" font-family="monospace" font-size="12" fill="#8e929e">DIMENSION</text>
    
    <!-- Row 1 -->
    <rect x="0" y="55" width="1040" height="60" fill="#141519" stroke="#22242c" stroke-width="1"/>
    <text x="20" y="90" font-family="monospace" font-size="13" fill="#e84a27">#01</text>
    <text x="100" y="90" font-family="monospace" font-size="13" fill="#f4f4f6">0.9412 [dense: 0.89 / lex: 0.96]</text>
    <text x="280" y="90" font-family="sans-serif" font-size="13" fill="#8e929e">"Partitioned inverted index structures with bi-encoder similarity scoring..."</text>
    <text x="900" y="90" font-family="monospace" font-size="12" fill="#5e6270">768-D</text>

    <!-- Row 2 -->
    <rect x="0" y="130" width="1040" height="60" fill="#141519" stroke="#22242c" stroke-width="1"/>
    <text x="20" y="165" font-family="monospace" font-size="13" fill="#8e929e">#02</text>
    <text x="100" y="165" font-family="monospace" font-size="13" fill="#f4f4f6">0.8870 [dense: 0.91 / lex: 0.85]</text>
    <text x="280" y="165" font-family="sans-serif" font-size="13" fill="#8e929e">"Memory-mapped vector lookup caching with quantized weights..."</text>
    <text x="900" y="165" font-family="monospace" font-size="12" fill="#5e6270">768-D</text>

    <!-- Row 3 -->
    <rect x="0" y="205" width="1040" height="60" fill="#141519" stroke="#22242c" stroke-width="1"/>
    <text x="20" y="240" font-family="monospace" font-size="13" fill="#8e929e">#03</text>
    <text x="100" y="240" font-family="monospace" font-size="13" fill="#f4f4f6">0.8245 [dense: 0.84 / lex: 0.80]</text>
    <text x="280" y="240" font-family="sans-serif" font-size="13" fill="#8e929e">"Concurrent query evaluation pipeline with streaming telemetry..."</text>
    <text x="900" y="240" font-family="monospace" font-size="12" fill="#5e6270">768-D</text>
  </g>

  <!-- Dev watermark stamp -->
  <rect x="360" y="580" width="480" height="45" fill="#0d0e11" stroke="#e84a27" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="600" y="608" font-family="monospace" font-size="12" fill="#e84a27" letter-spacing="1.5" text-anchor="middle">
    [PLACEHOLDER SCREENSHOT — CONTEXTUAL SEARCH ENGINE]
  </text>
</svg>
